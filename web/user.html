<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUUUI WIN - Gaming Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    .game-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .timer { font-size: 4rem; font-weight: bold; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
    .bet-btn { transition: all 0.3s ease; }
    .bet-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-gray-950 text-white">

<!-- Navigation -->
<nav class="bg-gray-900 border-b border-gray-700 sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-bold">🎮 SUUUI WIN</h1>
    <div class="flex items-center gap-4">
      <span id="balance" class="text-yellow-400 font-bold">₹0.00</span>
      <div class="flex gap-2">
        <button onclick="goToPage('wallet')" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded">Wallet</button>
        <button onclick="logout()" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded">Logout</button>
      </div>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="max-w-6xl mx-auto p-4">
  
  <!-- Game Page -->
  <div id="gamePage" class="game-page">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <!-- Game Board -->
      <div class="lg:col-span-2 bg-gray-900 rounded-lg p-6 border border-gray-700">
        <h2 class="text-2xl font-bold mb-6">WinGo 30S</h2>
        
        <div class="text-center mb-8">
          <div class="timer" id="timer">30</div>
          <p class="text-gray-400 text-sm mt-2">Period: <span id="periodId">-</span></p>
        </div>

        <!-- Last Result -->
        <div id="lastResult" class="hidden bg-gradient-to-r from-blue-900 to-purple-900 rounded-lg p-6">
          <h3 class="text-xl font-bold mb-4">📊 Last Result</h3>
          <div class="flex justify-around items-center text-center">
            <div>
              <div id="resultNumber" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto bg-red-600">
                <span class="text-4xl font-bold">0</span>
              </div>
              <p class="text-gray-300 mt-2" id="resultColor">Red</p>
            </div>
            <div>
              <p class="text-gray-300 mb-2">Size</p>
              <p class="text-2xl font-bold" id="resultSize">Small</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Bet Panel -->
      <div class="bg-gray-900 rounded-lg p-6 border border-gray-700 h-fit sticky top-20">
        <h3 class="text-xl font-bold mb-4">💰 Place Bet</h3>
        
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-400 mb-1">Bet Amount (₹)</label>
            <input type="number" id="betAmount" value="100" min="10" max="100000" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white focus:border-purple-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="placeBet('Red')" class="bet-btn bg-red-600 hover:bg-red-700 py-3 rounded font-bold">🔴 Red</button>
            <button onclick="placeBet('Green')" class="bet-btn bg-green-600 hover:bg-green-700 py-3 rounded font-bold">🟢 Green</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="placeBet('Big')" class="bet-btn bg-blue-600 hover:bg-blue-700 py-3 rounded font-bold">📈 Big</button>
            <button onclick="placeBet('Small')" class="bet-btn bg-indigo-600 hover:bg-indigo-700 py-3 rounded font-bold">📉 Small</button>
          </div>

          <div class="grid grid-cols-5 gap-1">
            <button onclick="placeBet('0')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">0</button>
            <button onclick="placeBet('1')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">1</button>
            <button onclick="placeBet('2')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">2</button>
            <button onclick="placeBet('3')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">3</button>
            <button onclick="placeBet('4')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">4</button>
            <button onclick="placeBet('5')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">5</button>
            <button onclick="placeBet('6')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">6</button>
            <button onclick="placeBet('7')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">7</button>
            <button onclick="placeBet('8')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">8</button>
            <button onclick="placeBet('9')" class="bet-btn bg-purple-600 hover:bg-purple-700 py-2 rounded text-sm font-bold">9</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Wallet Page -->
  <div id="walletPage" class="hidden">
    <div class="bg-gray-900 rounded-lg p-6 border border-gray-700 mb-6">
      <h2 class="text-2xl font-bold mb-6">💼 Wallet</h2>
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-purple-900 rounded-lg p-4 text-center">
          <p class="text-gray-400 text-sm">Balance</p>
          <p class="text-2xl font-bold text-yellow-400">₹<span id="walletBalance">0</span></p>
        </div>
        <div class="bg-green-900 rounded-lg p-4 text-center">
          <p class="text-gray-400 text-sm">Deposited</p>
          <p class="text-2xl font-bold text-green-400">₹<span id="totalDeposited">0</span></p>
        </div>
        <div class="bg-blue-900 rounded-lg p-4 text-center">
          <p class="text-gray-400 text-sm">Wagered</p>
          <p class="text-2xl font-bold text-blue-400">₹<span id="totalWagered">0</span></p>
        </div>
        <div class="bg-indigo-900 rounded-lg p-4 text-center">
          <p class="text-gray-400 text-sm">Withdrawals</p>
          <p class="text-2xl font-bold text-indigo-400">₹<span id="totalWithdrawn">0</span></p>
        </div>
      </div>

      <div class="flex gap-4">
        <button onclick="goToPage('deposit')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">💳 Deposit</button>
        <button onclick="goToPage('withdrawal')" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg">🏦 Withdraw</button>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="bg-gray-900 rounded-lg p-6 border border-gray-700">
      <h3 class="text-xl font-bold mb-4\">📋 Transaction History</h3>
      <div id="historyTable" class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="border-b border-gray-600\">
            <tr class="text-gray-400">
              <th class="text-left py-2">Type</th>
              <th class="text-left py-2">Amount</th>
              <th class="text-left py-2">Status</th>
              <th class="text-left py-2">Date</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Deposit Page -->
  <div id="depositPage" class="hidden">
    <div class="bg-gray-900 rounded-lg p-6 border border-gray-700 max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold mb-6">💰 Deposit Funds</h2>
      
      <div id="depositMethods" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <!-- Methods loaded dynamically -->
      </div>

      <div id="depositForm" class="hidden bg-gray-800 rounded-lg p-6 border border-gray-600">
        <h3 class="text-xl font-bold mb-4">Payment Details</h3>
        <div id="paymentDetails"></div>
        
        <div class="mt-6">
          <label class="block text-sm text-gray-400 mb-2">Amount (₹)</label>
          <input type="number" id="depositAmount" placeholder="Enter amount" class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white focus:border-purple-500 focus:outline-none mb-4">
          
          <button onclick="submitDeposit()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">Continue</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Withdrawal Page -->
  <div id="withdrawalPage" class="hidden">
    <div class="bg-gray-900 rounded-lg p-6 border border-gray-700 max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold mb-6">🏦 Withdraw Funds</h2>
      
      <div class="bg-blue-900 border border-blue-600 rounded-lg p-4 mb-6">
        <p class="text-sm">Daily withdrawals remaining: <span id="withdrawalsLeft" class="font-bold">3</span>/3</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-2">Method</label>
          <select id="withdrawMethod" class="w-full bg-gray-800 border border-gray-600 rounded px-4 py-2 text-white focus:border-purple-500 focus:outline-none">
            <option value="UPI">UPI</option>
            <option value="BANK">Bank Transfer</option>
            <option value="CRYPTO">Cryptocurrency</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Amount (₹)</label>
          <input type="number" id="withdrawAmount" placeholder="Enter amount" class="w-full bg-gray-800 border border-gray-600 rounded px-4 py-2 text-white focus:border-purple-500 focus:outline-none">
        </div>

        <div id="methodDetails"></div>

        <button onclick="submitWithdrawal()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg">Request Withdrawal</button>
      </div>
    </div>
  </div>

</div>

<script>
const API_URL = 'http://localhost:5000/api';
let socket;
let currentUser = null;
let currentPeriod = '';

// Initialize
function init() {
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = 'login.html';
    return;
  }

  socket = io('http://localhost:5000');
  socket.on('gameState', (data) => {
    currentPeriod = data.periodId;
    document.getElementById('periodId').textContent = data.periodId;
  });
  socket.on('timerTick', (data) => {
    document.getElementById('timer').textContent = data.timer;
  });
  socket.on('gameResult', (data) => {
    showResult(data);
  });

  loadUserData();
  loadDepositMethods();
}

async function loadUserData() {
  try {
    const token = localStorage.getItem('token');
    const response = await axios.get(`${API_URL}/auth/profile`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    currentUser = response.data.user;
    updateBalance();
  } catch (error) {
    console.error('Error loading user:', error);
  }
}

function updateBalance() {
  if (currentUser) {
    document.getElementById('balance').textContent = `₹${currentUser.walletBalance.toFixed(2)}`;
    document.getElementById('walletBalance').textContent = currentUser.walletBalance.toFixed(2);
    document.getElementById('totalDeposited').textContent = currentUser.totalDeposited.toFixed(2);
    document.getElementById('totalWagered').textContent = currentUser.totalWagered.toFixed(2);
  }
}

async function placeBet(option) {
  if (!currentUser) return;
  
  const amount = parseFloat(document.getElementById('betAmount').value);
  if (amount < 10 || amount > 100000) {
    alert('Bet amount between ₹10 - ₹100,000');
    return;
  }

  try {
    const token = localStorage.getItem('token');
    const response = await axios.post(`${API_URL}/game/place-bet`, {
      periodId: currentPeriod,
      gameType: 'WinGo_30s',
      selectedOption: option,
      amount: amount
    }, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (response.data.success) {
      alert(`Bet placed: ₹${amount} on ${option}`);
      currentUser.walletBalance -= amount;
      updateBalance();
    }
  } catch (error) {
    alert(error.response?.data?.error || 'Bet failed');
  }
}

function showResult(data) {
  const resultDiv = document.getElementById('lastResult');
  const colorMap = { 'Red': 'bg-red-600', 'Green': 'bg-green-600', 'Violet': 'bg-purple-600' };
  
  document.getElementById('resultNumber').className = `w-20 h-20 rounded-full flex items-center justify-center mx-auto ${colorMap[data.color] || 'bg-gray-600'}`;
  document.getElementById('resultNumber').textContent = data.number;
  document.getElementById('resultColor').textContent = data.color;
  document.getElementById('resultSize').textContent = data.size;
  resultDiv.classList.remove('hidden');
}

async function loadDepositMethods() {
  try {
    const response = await axios.get(`${API_URL}/deposits/deposit-methods`);
    const container = document.getElementById('depositMethods');
    container.innerHTML = response.data.methods.map(m => `
      <button onclick="selectDepositMethod('${m._id}', '${m.methodType}')" class="bg-gray-800 border border-gray-600 hover:border-purple-500 rounded-lg p-4 text-center cursor-pointer transition">
        <p class="text-lg font-bold">${m.methodType === 'UPI' ? '📱' : m.methodType === 'BANK_TRANSFER' ? '🏦' : '₿'}</p>
        <p class="text-sm mt-2">${m.methodType}</p>
        <p class="text-xs text-gray-400 mt-1">Min: ₹${m.minAmount}</p>
      </button>
    `).join('');
  } catch (error) {
    console.error('Error loading deposit methods:', error);
  }
}

function selectDepositMethod(methodId, methodType) {
  document.getElementById('depositForm').classList.remove('hidden');
}

async function submitDeposit() {
  const amount = parseFloat(document.getElementById('depositAmount').value);
  try {
    const token = localStorage.getItem('token');
    const response = await axios.post(`${API_URL}/deposits/create-deposit-request`, {
      depositMethod: 'UPI',
      amount: amount,
      methodId: 'selected'
    }, {
      headers: { Authorization: `Bearer ${token}` }
    });
    alert('Deposit request created!');
    goToPage('wallet');
  } catch (error) {
    alert(error.response?.data?.error || 'Deposit failed');
  }
}

async function submitWithdrawal() {
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  const method = document.getElementById('withdrawMethod').value;
  
  try {
    const token = localStorage.getItem('token');
    const response = await axios.post(`${API_URL}/withdrawals/create-withdrawal-request`, {
      withdrawalMethod: method,
      amount: amount,
      methodId: 'selected'
    }, {
      headers: { Authorization: `Bearer ${token}` }
    });
    alert('Withdrawal request submitted!');
    goToPage('wallet');
  } catch (error) {
    alert(error.response?.data?.error || 'Withdrawal failed');
  }
}

function goToPage(page) {
  document.querySelectorAll('[id$="Page"]').forEach(p => p.classList.add('hidden'));
  document.getElementById(page + 'Page').classList.remove('hidden');
}

function logout() {
  localStorage.removeItem('token');
  window.location.href = 'login.html';
}

init();
</script>

</body>
</html>
