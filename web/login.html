<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUUUI WIN - User Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.3.0/axios.min.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-blue-900 to-black min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <!-- Login Form -->
  <div id="loginForm" class="bg-gray-900 rounded-lg shadow-2xl p-8 border border-gray-700">
    <h1 class="text-4xl font-bold text-white text-center mb-2">🎮 SUUUI WIN</h1>
    <p class="text-center text-gray-400 mb-8">Gaming Platform</p>
    
    <form onsubmit="userLogin(event)" class="space-y-4">
      <div>
        <label class="block text-gray-300 mb-2 font-semibold">Phone Number</label>
        <input type="tel" id="phoneNumber" required class="w-full bg-gray-800 text-white px-4 py-3 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none transition" placeholder="+919876543210">
      </div>
      
      <div>
        <label class="block text-gray-300 mb-2 font-semibold">Password</label>
        <input type="password" id="password" required class="w-full bg-gray-800 text-white px-4 py-3 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none transition" placeholder="••••••••">
      </div>
      
      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
        🔓 Login
      </button>
    </form>
    
    <p class="text-center text-gray-400 mt-6">
      Don't have an account? <a href="register.html" class="text-purple-400 hover:text-purple-300 font-semibold">Register Now</a>
    </p>

    <div class="mt-6 pt-6 border-t border-gray-700 text-center">
      <p class="text-gray-400 text-sm mb-3">🔐 Admin?</p>
      <a href="admin.html" class="text-blue-400 hover:text-blue-300 font-semibold">Go to Admin Panel</a>
    </div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';

async function userLogin(event) {
  event.preventDefault();
  
  const phoneNumber = document.getElementById('phoneNumber').value;
  const password = document.getElementById('password').value;
  
  try {
    const response = await axios.post(`${API_URL}/auth/login`, { phoneNumber, password });
    
    if (response.data.success) {
      localStorage.setItem('token', response.data.token);
      localStorage.setItem('user', JSON.stringify(response.data.user));
      window.location.href = 'user.html';
    }
  } catch (error) {
    alert(error.response?.data?.error || 'Login failed');
  }
}
</script>

</body>
</html>
